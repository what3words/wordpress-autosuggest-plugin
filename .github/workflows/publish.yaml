name: Tagged release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  publish:
    name: Publish to SVN
    runs-on: ubuntu-latest
    steps:
      - name: Install SVN
        run: |
          sudo apt-get install subversion nodejs -y
      - uses: actions/checkout@v4
      - name: Setup version env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Update version
        run: |
          sed -i 's/define(.W3W_PLUGIN_VERSION.,\s*.*)/define('\''W3W_PLUGIN_VERSION'\'', '\'$VERSION\'');/' w3w-autosuggest/w3w-autosuggest.php
          sed -i 's/\* Version:\s*.*/* Version:           '$VERSION'/' w3w-autosuggest/w3w-autosuggest.php
          sed -i 's/Stable tag: .*/Stable tag: '$VERSION'/' w3w-autosuggest/README.txt
          sed -i 's/"version": "[^"]*"/"version": "'$VERSION'"/' w3w-autosuggest-blocks/package.json
          sed -i 's/"version": "[^"]*"/"version": "'$VERSION'"/' w3w-autosuggest-blocks/src/block.json
      - name: Build w3w-autosuggest-blocks
        run: |
          pushd w3w-autosuggest-blocks
          npm install
          npm run build
          popd
      - name: Verify build output
        run: |
          if [ ! -d "w3w-autosuggest/public/blocks" ]; then
            echo "Error: Build output directory not found at w3w-autosuggest/public/blocks"
            exit 1
          fi
          if [ -z "$(ls -A w3w-autosuggest/public/blocks/*.js 2>/dev/null)" ]; then
            echo "Error: No compiled JS files found in w3w-autosuggest/public/blocks"
            exit 1
          fi
          echo "Build output verified in w3w-autosuggest/public/blocks"
      - name: Checkout from Wordpress SVN
        run: |
          svn co https://plugins.svn.wordpress.org:443/3-word-address-validation-field "$HOME/svn" --trust-server-cert --non-interactive
      - name: Validate release
        run: |
          if [ -d "$HOME/svn/tags/$VERSION" ]; then
            echo "$VERSION is already released.";
            exit 1;
          else
            echo "$VERSION is not yet released.";
          fi
      - name: Copy to assets
        run: |
          cp -r ./assets/* "$HOME/svn/assets"
      - name: Copy to trunk
        run: |
          cp -r ./w3w-autosuggest/* "$HOME/svn/trunk"
      - name: Add new files to SVN
        run: |
          pushd "$HOME/svn"
          svn add --force trunk assets
          popd
      - name: Commit trunk
        run: |
          pushd "$HOME/svn"
          svn ci -m "Updating trunk with release $VERSION" --username "${{ vars.WP_SVN_USERNAME }}" --password "${{ secrets.WP_SVN_PASSWORD }}" --trust-server-cert --non-interactive
          popd
      - name: Create a release from ${{ github.ref_name }}
        run: |
          svn cp "$HOME/svn/trunk" "$HOME/svn/tags/$VERSION" --trust-server-cert --non-interactive
      - name: Commit changes to SVN
        run: |
          pushd "$HOME/svn"
          svn ci -m "$VERSION release" --username "${{ vars.WP_SVN_USERNAME }}" --password "${{ secrets.WP_SVN_PASSWORD }}" --trust-server-cert --non-interactive
          popd
