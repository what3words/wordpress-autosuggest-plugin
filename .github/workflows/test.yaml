name: Pull request

on:
  pull_request:
jobs:
  test:
    name: Run cypress tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: '14.x'
            WORDPRESS_VERSION: 5.8.3
            PHP_VERSION: 7.4
            WOOCOMMERCE_VERSION: 5.7.1
            WORDPRESS_THEME: twentytwenty
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start WordPress
        run: |
          docker compose -f ./docker-compose.yaml up -d
        env:
          WORDPRESS_VERSION: ${{ matrix.WORDPRESS_VERSION }}
          PHP_VERSION: ${{ matrix.PHP_VERSION }}
          WOOCOMMERCE_VERSION: ${{ matrix.WOOCOMMERCE_VERSION }}
          WORDPRESS_THEME: ${{ matrix.WORDPRESS_THEME }}
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose ps ==="
          docker compose -f ./docker-compose.yaml ps
          echo "=== Docker Compose logs ==="
          docker compose -f ./docker-compose.yaml logs --no-color
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --prefix ./test
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./test
          browser: chrome
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: ./test/cypress/screenshots/**/*.png
          if-no-files-found: ignore
      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Recordings
          path: ./test/cypress/videos/**/*.mp4
          if-no-files-found: ignore

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
